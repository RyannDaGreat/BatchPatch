<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Spacetime Hull — Snappy UI (Offline)</title>
  <style>
    :root{ --bg:#0b0d12; --fg:#e8eef5; --muted:#a7b3c2; --line:#1e2937; --accent:#67e8f9; }
    *{box-sizing:border-box}
    body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    header { display:flex; gap:10px; align-items:center; padding:10px 12px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
    label { display:flex; align-items:center; gap:6px; color:var(--muted); }
    input[type="range"]{ width:360px; }
    input[type="number"]{ width:72px; padding:6px 8px; background:#0e1520; border:1px solid var(--line); color:var(--fg); border-radius:8px; }
    input[type="file"], button{ padding:6px 10px; background:#0e1520; border:1px solid var(--line); color:var(--fg); border-radius:8px; cursor:pointer; }
    button:hover{ outline:1px solid #243041 }
    #frameBox{ padding:6px 10px; border:1px solid var(--line); border-radius:8px; background:#0e1520; font-variant-numeric:tabular-nums; }
    #msg{ color:#ff7b7b; font-size:12px; margin-left:auto; }
    main{ display:flex; }
    canvas{ display:block; max-width:100%; height:auto; background:#000; cursor:crosshair; }
  </style>
</head>
<body>
  <header>
    <input id="file" type="file" accept="video/*" />
    <label>FPS <input id="fps" type="number" min="1" max="120" step="1" value="30"></label>
    <button id="playPause">▶</button>
    <input id="scrubber" type="range" min="0" max="0" step="1" value="0" />
    <span id="frameBox">Frame 0/0 · 0.00s</span>
    <button id="clear">Clear Points</button>
    <button id="renderVideo">Render Video</button>
    <span id="msg"></span>
  </header>
  <main>
    <canvas id="canvas"></canvas>
    <video id="video" muted playsinline preload="auto" style="display:none"></video>
  </main>
  <div id="outputContainer" style="display:none; margin-top:20px;">
    <h3>Rendered Output:</h3>
    <video id="outputVideo" controls style="max-width:100%;"></video>
    <br>
    <a id="downloadLink" style="display:none;">Download Video</a>
  </div>

  <script>
    // ===== Offline 3D Convex Hull (facet test) =====
    function sub(a,b){ return {x:a.x-b.x, y:a.y-b.y, z:a.z-b.z}; }
    function cross(u,v){ return {x:u.y*v.z-u.z*v.y, y:u.z*v.x-u.x*v.z, z:u.x*v.y-u.y*v.x}; }
    function dot(a,b){ return a.x*b.x+a.y*b.y+a.z*b.z; }
    function norm2(a){ return dot(a,a); }
    function buildHullFaces(pts){
      const n=pts.length, EPS=1e-6; if(n<4) return [];
      const faces=[], seen=new Set();
      for(let i=0;i<n;i++) for(let j=i+1;j<n;j++) for(let k=j+1;k<n;k++){
        const a=pts[i], b=pts[j], c=pts[k];
        const nrm = cross(sub(b,a), sub(c,a)); if(norm2(nrm)<EPS) continue;
        let pos=false, neg=false;
        for(let m=0;m<n;m++){ if(m===i||m===j||m===k) continue; const d=dot(nrm,sub(pts[m],a)); if(d>EPS) pos=true; else if(d<-EPS) neg=true; if(pos&&neg) break; }
        if(pos&&neg) continue; const key=[i,j,k].sort((x,y)=>x-y).join(',');
        if(!seen.has(key)){ seen.add(key); faces.push([i,j,k]); }
      }
      return faces;
    }
    function sliceFacesAtFrame(pts,faces,F){
      const EPS=1e-6, edges=[]; if(!faces.length) return [];
      for(const f of faces){ const p0=pts[f[0]],p1=pts[f[1]],p2=pts[f[2]]; const tri=[p0,p1,p2]; const z=tri.map(p=>p.z-F); const seg=[];
        for(let i=0;i<3;i++){ const a=tri[i], b=tri[(i+1)%3]; const za=z[i], zb=z[(i+1)%3]; if(Math.abs(za)<EPS) seg.push({x:a.x,y:a.y}); if(za*zb<0){ const alpha=za/(za-zb); seg.push({x:a.x+alpha*(b.x-a.x), y:a.y+alpha*(b.y-a.y)}); } }
        if(seg.length===2) edges.push(seg);
      }
      if(!edges.length) return [];
      const verts=[]; for(const e of edges){ for(const p of e){ if(!verts.some(q=>Math.hypot(q.x-p.x,q.y-p.y)<1e-4)) verts.push(p); } }
      if(verts.length<3) return [];
      const cx=verts.reduce((s,p)=>s+p.x,0)/verts.length, cy=verts.reduce((s,p)=>s+p.y,0)/verts.length;
      verts.sort((A,B)=>Math.atan2(A.y-cy,A.x-cx)-Math.atan2(B.y-cy,B.x-cx));
      return verts;
    }

    // ===== MP4 Frame Counter =====
    const find=(v,atom,start=0)=>{for(let i=start;i<v.byteLength-8;i++)if(v.getUint32(i+4)==atom)return i;return-1}
    const hasVideo=(v,start)=>{for(let i=start;i<v.byteLength-20;i++)if(v.getUint32(i)==0x68646c72&&v.getUint32(i+12)==0x76696465)return 1}
    const getFrames=(v,start)=>{for(let i=start;i<v.byteLength-20;i++)if(v.getUint32(i)==0x7374737a)return v.getUint32(i+12)}
    async function parseMP4Frames(file){const v=new DataView(await file.arrayBuffer());const m=find(v,0x6d6f6f76);return m>-1&&hasVideo(v,m)?getFrames(v,m):0}

    // ===== App state =====
    const file = document.getElementById('file');
    const fpsInput = document.getElementById('fps');
    const playPause = document.getElementById('playPause');
    const scrubber = document.getElementById('scrubber');
    const frameBox = document.getElementById('frameBox');
    const clearBtn = document.getElementById('clear');
    const renderVideoBtn = document.getElementById('renderVideo');
    const msg = document.getElementById('msg');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('video');
    const outputContainer = document.getElementById('outputContainer');
    const outputVideo = document.getElementById('outputVideo');
    const downloadLink = document.getElementById('downloadLink');

    let points=[];     // {x,y,z} where z=frame index
    let fps=30;        // only for video seeking
    let totalFrames=0; // actual frame count from MP4 metadata
    let isPlaying=false;
    let playInterval;

    function frameToTime(fi){ return fi / fps; }

    let currentFrame = 0;
    let seekResolve;
    video.addEventListener('seeked', ()=>{ if(seekResolve) seekResolve(); });

    async function renderFrame(fi){
      const clamped = Math.max(0, Math.min(totalFrames-1, fi|0));
      const t = frameToTime(clamped);

      if (isFinite(video.duration)) {
        video.currentTime = t;
        await new Promise(r => seekResolve = r);
      }

      ctx.clearRect(0,0,canvas.width,canvas.height);
      if (video.readyState >= 2) ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const faces = buildHullFaces(points);
      const poly = sliceFacesAtFrame(points, faces, clamped);
      if (poly.length >= 3){
        ctx.beginPath(); for(let i=0;i<poly.length;i++) (i?ctx.lineTo:ctx.moveTo).call(ctx, poly[i].x, poly[i].y); ctx.closePath();
        ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.strokeStyle='#67e8f9'; ctx.lineWidth=2; ctx.fill(); ctx.stroke();
      }

      for(const p of points){ const near=clamped===p.z; ctx.beginPath(); ctx.arc(p.x,p.y, near?5:4,0,2*Math.PI); ctx.fillStyle='#fff'; ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle=near?'#00ffa6':'#000'; ctx.stroke(); }

      currentFrame = clamped;
      scrubber.value = String(clamped);
      frameBox.textContent = `Frame ${clamped+1}/${totalFrames} · ${t.toFixed(2)}s`;
    }

    function updateDisplay(){
      msg.textContent = (points.length>=4 && buildHullFaces(points).length===0)?'Need ≥4 points across different times for a 3D hull.':'';
      renderFrame(currentFrame);
    }

    // Pure play/pause state functions
    const togglePlay = () => isPlaying ? stopPlay() : startPlay();
    const startPlay = () => { isPlaying = true; playPause.textContent = '⏸'; playInterval = setInterval(() => renderFrame((currentFrame + 1) % totalFrames), 1000/fps); };
    const stopPlay = () => { isPlaying = false; playPause.textContent = '▶'; clearInterval(playInterval); };

    // ===== Event wiring =====
    file.addEventListener('change', async e=>{
      const f=e.target.files[0]; if(!f) return; try{ if(video.src && video.src.startsWith('blob:')) URL.revokeObjectURL(video.src);}catch{}

      // Get actual frame count from MP4 metadata
      totalFrames = Math.max(1, await parseMP4Frames(f));

      const url=URL.createObjectURL(f); video.src=url; video.load();
      video.addEventListener('loadeddata', ()=>{
        canvas.width = video.videoWidth||640; canvas.height = video.videoHeight||360;
        fps = totalFrames / (video.duration || 1); // Calculate actual FPS
        fpsInput.value = Math.round(fps);
        scrubber.min = 0; scrubber.max = Math.max(0,totalFrames-1); scrubber.step = 1; scrubber.value = 0;
        video.muted = true; video.play().then(()=>video.pause()).catch(()=>{});
        renderFrame(0);
      }, { once:true });
      video.addEventListener('error', ()=>{ msg.textContent='Unable to decode this file in this browser.'; }, { once:true });
    });

    // Pure event handlers
    playPause.addEventListener('click', togglePlay);
    scrubber.addEventListener('input', e=>{ stopPlay(); renderFrame(parseInt(e.target.value,10)||0); });

    // FPS change updates UI scaling (totalFrames stays from MP4 metadata)
    fpsInput.addEventListener('change', ()=>{
      const newFps = Math.max(1, Math.min(120, parseInt(fpsInput.value,10)||30));
      fps = newFps;
      if(isPlaying) { stopPlay(); startPlay(); } // Restart with new fps
      else renderFrame(currentFrame);
    });

    // Click to add point at current frame
    canvas.addEventListener('click', e=>{
      if (!isFinite(video.duration)) return; const r=canvas.getBoundingClientRect();
      const x=e.clientX-r.left, y=e.clientY-r.top; points.push({x,y,z:currentFrame});
      updateDisplay();
    });

    clearBtn.addEventListener('click', ()=>{ points=[]; msg.textContent=''; renderFrame(currentFrame); });

    renderVideoBtn.addEventListener('click', async ()=>{
      if(!totalFrames || !video.duration) {
        msg.textContent = 'Load a video first';
        return;
      }

      msg.textContent = 'Rendering video...';
      renderVideoBtn.disabled = true;

      try {
        const stream = canvas.captureStream(fps);
        const mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
        const chunks = [];

        mediaRecorder.ondataavailable = e => chunks.push(e.data);
        mediaRecorder.onstop = () => {
          const blob = new Blob(chunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);

          outputVideo.src = url;
          outputContainer.style.display = 'block';

          downloadLink.href = url;
          downloadLink.download = 'rendered_animation.webm';
          downloadLink.textContent = 'Download Video';
          downloadLink.style.display = 'inline';

          msg.textContent = 'Video rendered!';
          renderVideoBtn.disabled = false;
        };

        mediaRecorder.start();

        // Render all frames
        for(let frame = 0; frame < totalFrames; frame++) {
          await renderFrame(frame);
          await new Promise(resolve => setTimeout(resolve, 1000/fps));
        }

        mediaRecorder.stop();
      } catch(e) {
        msg.textContent = 'Error rendering video: ' + e.message;
        renderVideoBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
